# Suricata two-probe sensor (Phase 2). hostNetwork DaemonSet; NET_ADMIN+NET_RAW
# for packet capture. Two containers:
#   ids1 (perimeter): af-packet on eth0  -> node/edge view, real external IPs
#   ids2 (internal):  libpcap on "any"   -> all pod-to-pod veths on this node
# EVE JSON is written per-probe under the hostPath /var/log/suricata, which the
# Phase-3 collector reads. Visibility limits are documented in lab/README.
apiVersion: v1
kind: Namespace
metadata: {name: security, labels: {gnn-lab/app: suricata}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: suricata-cfg, namespace: security}
data:
  dos-home.rules: |
    # Home Suricata rules for the DoS extension (Section 14 of the brief).
    # These are DETECTION rules for the two probes. threshold / detection_filter stop
    # one alert being raised per packet during a flood. Load alongside the Emerging
    # Threats Open "dos" category. sid range 9000000+ is reserved for home rules.
    
    alert tcp any any -> $HOME_NET 80 (msg:"HOME DOS SYN flood vers ingress"; \
        flags:S,12; threshold: type both, track by_dst, count 500, seconds 5; \
        classtype:attempted-dos; sid:9000001; rev:1;)
    
    alert http any any -> $HOME_NET any (msg:"HOME DOS HTTP flood - requetes repetees"; \
        flow:to_server,established; http.method; content:"GET"; \
        detection_filter: track by_dst, count 300, seconds 10; \
        classtype:attempted-dos; sid:9000002; rev:1;)
    
    alert tcp any any -> $HOME_NET 80 (msg:"HOME DOS slowloris - connexions lentes"; \
        flow:to_server,established; \
        detection_filter: track by_src, count 50, seconds 30; \
        classtype:attempted-dos; sid:9000003; rev:1;)
    
    alert udp any any -> $HOME_NET any (msg:"HOME DOS UDP flood"; \
        threshold: type both, track by_dst, count 800, seconds 5; \
        classtype:attempted-dos; sid:9000010; rev:1;)
    
    alert icmp any any -> $HOME_NET any (msg:"HOME DOS ICMP flood"; itype:8; \
        threshold: type both, track by_dst, count 600, seconds 5; \
        classtype:attempted-dos; sid:9000011; rev:1;)
  suricata.yaml.tmpl: |
    %YAML 1.1
    ---
    # Suricata config for one lab probe (Phase 2). The DaemonSet entrypoint
    # substitutes __PROBE__ and injects the capture stanza (__CAPTURE__), so the
    # same template serves the perimeter probe (af-packet on eth0) and the internal
    # probe (libpcap on "any", which on a single kind node sees all pod veths).
    vars:
      address-groups:
        HOME_NET: "[10.244.0.0/16,10.96.0.0/12,172.18.0.0/16]"
        EXTERNAL_NET: "!$HOME_NET"
      port-groups:
        HTTP_PORTS: "80"
    
    __CAPTURE__
    
    default-log-dir: /var/log/suricata/__PROBE__
    outputs:
      - eve-log:
          enabled: yes
          filetype: regular
          filename: eve.json
          types:
            - alert: {metadata: yes, xff: {enabled: yes, mode: extra-data, header: X-Forwarded-For}}
            - http: {extended: yes}
            - flow
            - stats: {enabled: yes, interval: 10}
    logging:
      default-log-level: notice
      outputs:
        - console: {enabled: yes}
    app-layer:
      protocols: {http: {enabled: yes}, tls: {enabled: yes}, dns: {enabled: yes}}
    default-rule-path: /etc/suricata/rules
    rule-files: [dos-home.rules]
    host-mode: sniffer-only
    runmode: workers
  entrypoint.sh: |
    #!/bin/sh
    # Render the per-probe Suricata config and run it. Env:
    #   PROBE         probe name (ids1|ids2), also the EVE subdir
    #   CAPTURE_MODE  afpacket|pcap
    #   IFACE         interface (eth0, or "any" for pcap)
    set -eu
    mkdir -p "/var/log/suricata/${PROBE}"
    if [ "${CAPTURE_MODE}" = afpacket ]; then
      CAP="af-packet:
      - interface: ${IFACE}
        cluster-id: ${CLUSTER_ID:-99}
        cluster-type: cluster_flow
        defrag: yes
        use-mmap: yes
        tpacket-v3: yes"
    else
      CAP="pcap:
      - interface: ${IFACE}
        buffer-size: 16777216"
    fi
    sed -e "s/__PROBE__/${PROBE}/g" /etc/suricata/suricata.yaml.tmpl > /tmp/suricata.yaml
    # inject the capture block in place of the __CAPTURE__ marker
    awk -v cap="$CAP" '/__CAPTURE__/{print cap; next} {print}' /tmp/suricata.yaml > /tmp/suricata.final.yaml
    echo "[entrypoint] probe=${PROBE} mode=${CAPTURE_MODE} iface=${IFACE}"
    if [ "${CAPTURE_MODE}" = afpacket ]; then
      exec suricata -c /tmp/suricata.final.yaml --af-packet
    else
      exec suricata -c /tmp/suricata.final.yaml --pcap
    fi
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: suricata, namespace: security, labels: {gnn-lab/app: suricata}}
spec:
  selector: {matchLabels: {app: suricata}}
  template:
    metadata: {labels: {app: suricata, gnn-lab/app: suricata}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations: [{operator: Exists}]
      volumes:
        - {name: cfg, configMap: {name: suricata-cfg, defaultMode: 0755}}
        - {name: evelog, hostPath: {path: /var/log/suricata, type: DirectoryOrCreate}}
      containers:
        - name: ids1
          image: jasonish/suricata:7.0.8
          command: ["/bin/sh","/cfg/entrypoint.sh"]
          env: [{name: PROBE, value: ids1}, {name: CAPTURE_MODE, value: afpacket}, {name: IFACE, value: eth0}, {name: CLUSTER_ID, value: "97"}]
          securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW, SYS_NICE]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts:
            - {name: cfg, mountPath: /cfg}
            - {name: cfg, mountPath: /etc/suricata/suricata.yaml.tmpl, subPath: suricata.yaml.tmpl}
            - {name: cfg, mountPath: /etc/suricata/rules/dos-home.rules, subPath: dos-home.rules}
            - {name: evelog, mountPath: /var/log/suricata}
        - name: ids2
          image: jasonish/suricata:7.0.8
          command: ["/bin/sh","/cfg/entrypoint.sh"]
          env: [{name: PROBE, value: ids2}, {name: CAPTURE_MODE, value: pcap}, {name: IFACE, value: any}]
          securityContext: {capabilities: {add: [NET_ADMIN, NET_RAW, SYS_NICE]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts:
            - {name: cfg, mountPath: /cfg}
            - {name: cfg, mountPath: /etc/suricata/suricata.yaml.tmpl, subPath: suricata.yaml.tmpl}
            - {name: cfg, mountPath: /etc/suricata/rules/dos-home.rules, subPath: dos-home.rules}
            - {name: evelog, mountPath: /var/log/suricata}
