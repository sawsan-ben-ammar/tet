# Lightweight Prometheus for the lab (Phase 2). Chart: prometheus-community/prometheus.
# Only the server + node-exporter + kube-state-metrics; alertmanager / pushgateway off.
alertmanager: {enabled: false}
prometheus-pushgateway: {enabled: false}
prometheus-node-exporter:
  enabled: true
  resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
kube-state-metrics:
  enabled: true
  resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {cpu: 100m, memory: 128Mi}}
server:
  retention: 2h                  # short: the lab captures are exported to files anyway
  resources: {requests: {cpu: 100m, memory: 400Mi}, limits: {cpu: "1", memory: 900Mi}}
  persistentVolume: {enabled: false}
  global: {scrape_interval: 5s, scrape_timeout: 4s}   # 5s windows need fine metrics
  service: {type: ClusterIP}
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs: [{targets: ["localhost:9090"]}]
      - job_name: kubernetes-pods          # boutique pods + cilium (pod annotations)
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);(.+)
            replacement: $2:$1
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
      - job_name: kube-state-metrics
        static_configs: [{targets: ["prometheus-kube-state-metrics.monitoring.svc:8080"]}]
      - job_name: cadvisor                   # per-container CPU/mem/net from the kubelet
        scheme: https
        tls_config: {insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - replacement: kubernetes.default.svc:443
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
            target_label: __metrics_path__
