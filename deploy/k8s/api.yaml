# API deployment + service. The trained models are mounted from a ConfigMap-free
# approach: bake them into the image (recommended) or mount a PVC. Here we assume
# they are baked into the image at build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-api
  namespace: correlation
  labels: {app: correlation-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: correlation-api}
  template:
    metadata:
      labels: {app: correlation-api}
    spec:
      containers:
        - name: api
          image: gnn-ddos/api:1.0
          ports: [{containerPort: 8000}]
          env:
            - {name: GNN_ARTIFACTS, value: /app/model/artifacts}
            - {name: IDS_IA_MODEL, value: /app/ids/artifacts/ia.json}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "2Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-api
  namespace: correlation
spec:
  selector: {app: correlation-api}
  ports:
    - {port: 80, targetPort: 8000}
